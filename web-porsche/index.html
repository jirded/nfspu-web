<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porsche Unleashed Recompiled</title>
<style>
  :root { color-scheme: dark; --bg: #0b0b0c; --fg: #e8e6e3; --mute: #8d8a85; --accent: #c8102e; --panel: #151517; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--panel); flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #status { color: var(--mute); flex: 1; min-width: 200px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; border: 1px solid #444; color: var(--fg); font-weight: 400; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 8px; }
  #screen { background: #000; image-rendering: auto; max-width: 100%; max-height: 100%; aspect-ratio: 4 / 3; height: 100%; outline: none; }
  #log { display: none; margin: 0; padding: 8px 16px; height: 30vh; overflow: auto; background: #000; color: #9fd29f; font: 12px/1.35 ui-monospace, monospace; white-space: pre-wrap; }
  body.showlog #log { display: block; }
</style>
<script type="module" src="/main.js"></script>
</head>
<body>
<header>
  <h1>Porsche Unleashed Recompiled</h1>
  <span id="status">Loading.</span>
  <button id="play" disabled>Play</button>
  <button id="full" class="ghost">Full screen</button>
  <button id="logbtn" class="ghost">Log</button>
</header>
<main><canvas id="screen" width="640" height="480" tabindex="0"></canvas></main>
<pre id="log"></pre>
</body>
</html>
